name: locadex-ci
on:
  push:
  pull_request:
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - c_compiler: gcc
            cxx_compiler: g++
            build_type: Debug
          - c_compiler: gcc
            cxx_compiler: g++
            build_type: Release
          - c_compiler: clang
            cxx_compiler: clang++
            build_type: Debug
          - c_compiler: clang
            cxx_compiler: clang++
            build_type: Release
    env:
      CC: ${{ matrix.c_compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict C99 tests
        run: cmake -S . -B build -DLOCADEX_BUILD_TESTS=ON -DLOCADEX_STRICT_WARNINGS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Configure GCC strict C99 tests with ${{ matrix.sanitizer }} sanitizer
        run: cmake -S . -B build -DLOCADEX_BUILD_TESTS=ON -DLOCADEX_STRICT_WARNINGS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -fno-sanitize-recover=all" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict C99 tests
        run: cmake -S . -B build -DLOCADEX_BUILD_TESTS=ON -DLOCADEX_STRICT_WARNINGS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
